# Haftalık rapor — pazartesi 08:45 Europe/Istanbul = 05:45 UTC (TR UTC+3, DST yok).
name: rapor

on:
  schedule:
    - cron: "45 5 * * 1"
  workflow_dispatch:

concurrency:
  group: pusula-ops
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
  CLIQ_WEBHOOK_URL: ${{ secrets.CLIQ_WEBHOOK_URL }}
  PUSULA_REPORT_RECIPIENTS: ${{ secrets.PUSULA_REPORT_RECIPIENTS }}
  PUSULA_SHADOW_EMAIL: ${{ secrets.PUSULA_SHADOW_EMAIL }}

jobs:
  rapor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Weekly report
        run: python scripts/weekly_report.py --apply
