# Günlük dürtü — 08:30 Europe/Istanbul = 05:30 UTC (TR UTC+3, DST yok).
# Ingest ile aynı concurrency grubu: ingest bitmeden başlamaz.
name: nudges

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

concurrency:
  group: pusula-ops
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
  CLIQ_WEBHOOK_URL: ${{ secrets.CLIQ_WEBHOOK_URL }}
  PUSULA_SHADOW_EMAIL: ${{ secrets.PUSULA_SHADOW_EMAIL }}

jobs:
  nudges:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Send nudges
        run: python scripts/send_nudges.py --apply
