# Görüşme Analizleri — her gece dünün haftasını işler (01:30 İstanbul = 22:30 UTC).
# Gecikme sorun değil: yarıda kalan kayıt sonraki gece devam eder. Pazartesi
# gecesi biten haftanın özeti kesinleşir. Elle: hafta ve adım sınırı verilebilir.
# Verimor kayıt adresi dakikada 5 istekle sınırlı (~280 çağrı/saat).
name: gorusme-analizi

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      week:
        description: "Haftanın bir günü (YYYY-AA-GG); boşsa dünün haftası"
        default: ""
      limit:
        description: "Adım başına en fazla kayıt (deneme; boşsa sınırsız)"
        default: ""

concurrency:
  group: pusula-gorusme
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  VERIMOR_API_KEY: ${{ secrets.VERIMOR_API_KEY }}
  ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
  ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
  ZOHO_ACCOUNTS_DOMAIN: ${{ secrets.ZOHO_ACCOUNTS_DOMAIN }}
  ZOHO_MEETING_REFRESH_TOKEN: ${{ secrets.ZOHO_MEETING_REFRESH_TOKEN }}
  PUSULA_STT_PROVIDER: ${{ secrets.PUSULA_STT_PROVIDER }}
  PUSULA_STT_MODEL: ${{ secrets.PUSULA_STT_MODEL }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
  DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}

jobs:
  gorusme-analizi:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements.txt
      - name: ffmpeg (toplantı videosu → ses)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Görüşmeleri analiz et
        run: |
          ARGS="--budget-min 270"
          if [ -n "${{ inputs.week }}" ]; then ARGS="$ARGS --week ${{ inputs.week }}"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python scripts/conversation_analysis.py $ARGS
