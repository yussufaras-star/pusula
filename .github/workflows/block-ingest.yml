# Blok sonu ingest: calls (6 saat) sonra bookings (24 saat).
# 11:15 / 14:15 / 17:15 / 18:15 Europe/Istanbul (UTC+3, DST yok).
# Bitimden 15 dakika sonra; Zoho kaydının düşmesi için pay.
# Günlük ingest.yml sırasına dokunulmaz.
name: block-ingest

on:
  schedule:
    - cron: "15 8 * * *"
    - cron: "15 11 * * *"
    - cron: "15 14 * * *"
    - cron: "15 15 * * *"
  workflow_dispatch:

concurrency:
  group: pusula-ops
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
  ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
  ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
  ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
  ZOHO_ACCOUNTS_DOMAIN: ${{ secrets.ZOHO_ACCOUNTS_DOMAIN }}
  ZOHO_API_DOMAIN: ${{ secrets.ZOHO_API_DOMAIN }}

jobs:
  sync-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Sync calls (block)
        run: python scripts/block_ingest.py
      - name: Sync bookings (block)
        run: python scripts/block_ingest.py --source zoho_bookings
