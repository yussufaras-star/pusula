# Saatlik tazelik: Istanbul 09:00-19:00, her saat basi dakika 07.
# UTC (TR UTC+3, DST yok): 06:07-16:07 → cron "7 6-16 * * *".
# Blok bitişleri tam saatte; bitişten 7 dk sonra dört kaynak çekilir.
# Sıra: aramalar → randevular → lead'ler → kişiler. Lookback 6 saat.
# Günlük ingest.yml tam çekim olarak kalır.
name: block-ingest

on:
  schedule:
    - cron: "7 6-16 * * *"
  workflow_dispatch:

concurrency:
  group: pusula-block
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
  ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
  ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
  ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
  ZOHO_ACCOUNTS_DOMAIN: ${{ secrets.ZOHO_ACCOUNTS_DOMAIN }}
  ZOHO_API_DOMAIN: ${{ secrets.ZOHO_API_DOMAIN }}
  ZOHO_MEETING_REFRESH_TOKEN: ${{ secrets.ZOHO_MEETING_REFRESH_TOKEN }}
  CLIQ_WEBHOOK_URL: ${{ secrets.CLIQ_WEBHOOK_URL }}
  PUSULA_SHADOW_EMAIL: ${{ secrets.PUSULA_SHADOW_EMAIL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  # 1: tempo dürtmesi temsilciye gider (gölge adresi atlanır). 0/boş: gölge.
  PUSULA_PACE_NUDGES_LIVE: ${{ vars.PUSULA_PACE_NUDGES_LIVE }}
  PUSULA_WHATSAPP_INGEST: ${{ vars.PUSULA_WHATSAPP_INGEST }}

jobs:
  sync-hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements.txt
      - name: Saatlik dört kaynak
        run: python scripts/block_ingest.py
      - name: Zoho Meeting katılımı (son 2 gün)
        run: python scripts/meeting_ingest.py --days 2
      # WhatsApp ve CRM işlemleri saatlik akışta yoktu; doluluk ve dürtme
      # bunlar olmadan eksik ölçer. Mesai dışında kendiliğinden atlar.
      # Aylık prim hedefi: deal paketi, aşama, tutar (saatlik).
      - name: Deal paketleri
        continue-on-error: true
        run: python scripts/deal_packages.py
      # Re-Co yenileme analizi: müşteri profili (abonelik, son 1 yıllık satış).
      - name: Müşteri profilleri
        continue-on-error: true
        run: python scripts/contact_profiles.py
      # Raporlar'daki statü × kaynak kırılımı (UTM kaynağı, kampanya, içerik).
      - name: Lead reklam kaynağı
        continue-on-error: true
        run: python scripts/lead_attribution.py
      # Lead sahibi/statüsü Zoho'dan; silinen ya da kişiye dönüştürülen lead
      # portföyde temsilcinin üzerinde kalmasın.
      - name: Lead senkronu
        continue-on-error: true
        run: python scripts/lead_sync.py
      - name: WhatsApp ve CRM işlemleri
        continue-on-error: true
        run: python scripts/live_ingest.py
      # Taze veriyle hedef temposu; gerisindekilere Cliq (ilk 14 gün AI'lı
      # mesajlar panelde onay bekler). Hata ingest'i başarısız saymaz.
      - name: Tempo dürtmesi
        continue-on-error: true
        run: python scripts/pace_nudges.py
