# Saatlik tazelik: Istanbul 09:00-19:00, her saat basi dakika 07.
# UTC (TR UTC+3, DST yok): 06:07-16:07 → cron "7 6-16 * * *".
# Blok bitişleri tam saatte; bitişten 7 dk sonra dört kaynak çekilir.
# Sıra: aramalar → randevular → lead'ler → kişiler. Lookback 6 saat.
# Günlük ingest.yml tam çekim olarak kalır.
name: block-ingest

on:
  schedule:
    - cron: "7 6-16 * * *"
  workflow_dispatch:

concurrency:
  group: pusula-block
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
  ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
  ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
  ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
  ZOHO_ACCOUNTS_DOMAIN: ${{ secrets.ZOHO_ACCOUNTS_DOMAIN }}
  ZOHO_API_DOMAIN: ${{ secrets.ZOHO_API_DOMAIN }}

jobs:
  sync-hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements.txt
      - name: Saatlik dört kaynak
        run: python scripts/block_ingest.py
