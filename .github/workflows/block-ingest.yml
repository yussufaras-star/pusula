# Saatlik tazelik: Istanbul 09:00-19:00, her saat basi dakika 07.
# UTC (TR UTC+3, DST yok): 06:07-16:07 → cron "7 6-16 * * *".
# Blok bitişleri tam saatte; bitişten 7 dk sonra dört kaynak çekilir.
# Sıra: aramalar → randevular → lead'ler → kişiler. Lookback 6 saat.
# Günlük ingest.yml tam çekim olarak kalır.
name: block-ingest

on:
  # Harici tetikleyici her saat :07'de dispatch eder (13 Ekim'den beri);
  # GitHub cron'u saatlerce gecikip çift çalışma üretiyordu, kaldırıldı.
  workflow_dispatch:

concurrency:
  group: pusula-block
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
  ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
  ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
  ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
  ZOHO_ACCOUNTS_DOMAIN: ${{ secrets.ZOHO_ACCOUNTS_DOMAIN }}
  ZOHO_API_DOMAIN: ${{ secrets.ZOHO_API_DOMAIN }}
  ZOHO_MEETING_REFRESH_TOKEN: ${{ secrets.ZOHO_MEETING_REFRESH_TOKEN }}
  ZOHO_PEOPLE_REFRESH_TOKEN: ${{ secrets.ZOHO_PEOPLE_REFRESH_TOKEN }}
  CLIQ_WEBHOOK_URL: ${{ secrets.CLIQ_WEBHOOK_URL }}
  PUSULA_SHADOW_EMAIL: ${{ secrets.PUSULA_SHADOW_EMAIL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  # 1: tempo dürtmesi temsilciye gider (gölge adresi atlanır). 0/boş: gölge.
  PUSULA_PACE_NUDGES_LIVE: ${{ vars.PUSULA_PACE_NUDGES_LIVE }}
  PUSULA_WHATSAPP_INGEST: ${{ vars.PUSULA_WHATSAPP_INGEST }}

jobs:
  # Kart güvencesi: gun-saati'nin asıl tetiği (Cliq zamanlayıcısı) 20:55'te
  # gelebiliyor, GitHub cron'u da düşebiliyor (19 Ekim'de 12:30 kartı
  # gitmedi). Bu iş her saat güvenilir geldiğinden, o gün gun-saati hiç
  # başlamadıysa (iptaller hariç) onu başlatır. gun-saati saati geçen kartı
  # atlar; çift başlarsa ikincisi sırada bekler.
  gun-saati-guvence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Gün saati bugün başladı mı
        run: |
          saat=$(TZ=Europe/Istanbul date +%H)
          gun=$(TZ=Europe/Istanbul date +%u)
          if [ "$gun" = "7" ] || [ "$saat" -ge 19 ]; then
            echo "atlandı: pazar ya da 19:00 sonrası"; exit 0
          fi
          bugun=$(TZ=Europe/Istanbul date +%F)
          n=$(gh run list --workflow gun-saati.yml --limit 20 --json createdAt,conclusion \
            --jq "[.[] | select(.conclusion != \"cancelled\") | .createdAt | fromdateiso8601 | . + 10800 | strftime(\"%Y-%m-%d\") | select(. == \"$bugun\")] | length")
          if [ "$n" -gt 0 ]; then
            echo "gun-saati bugün başlamış ($n)"
          else
            echo "gun-saati bugün başlamamış; tetikleniyor"
            gh workflow run gun-saati.yml --ref main
          fi

  sync-hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements.txt
      # İzinler önce: meeting-nudges'ın GitHub zamanlaması güvenilmez (gün
      # boyu hiç çalışmayabiliyor); saatlik akış dış tetikle düzenli koşar.
      # İzinli temsilci tempo dürtmesi almasın, panelde izinli görünsün.
      - name: Zoho People izinleri
        continue-on-error: true
        run: python scripts/people_leaves.py
      - name: Saatlik dört kaynak
        run: python scripts/block_ingest.py
      - name: Zoho Meeting katılımı (son 2 gün)
        run: python scripts/meeting_ingest.py --days 2
      # WhatsApp ve CRM işlemleri saatlik akışta yoktu; doluluk ve dürtme
      # bunlar olmadan eksik ölçer. Mesai dışında kendiliğinden atlar.
      # Aylık prim hedefi: deal paketi, aşama, tutar (saatlik).
      - name: Deal paketleri
        continue-on-error: true
        run: python scripts/deal_packages.py
      # Re-Co yenileme analizi: müşteri profili (abonelik, son 1 yıllık satış).
      - name: Müşteri profilleri
        continue-on-error: true
        run: python scripts/contact_profiles.py
      # Raporlar'daki statü × kaynak kırılımı (UTM kaynağı, kampanya, içerik).
      - name: Lead reklam kaynağı
        continue-on-error: true
        run: python scripts/lead_attribution.py
      # Lead sahibi/statüsü Zoho'dan; silinen ya da kişiye dönüştürülen lead
      # portföyde temsilcinin üzerinde kalmasın.
      - name: Lead senkronu
        continue-on-error: true
        run: python scripts/lead_sync.py
      # Ekip Panosu "gelen lead": Zoho Leads'e günlük düşen lead (dönüştürülen
      # dahil). İlk çalışmada yıl başından doldurur, sonra son 3 günü yeniler.
      - name: Gelen lead akışı
        continue-on-error: true
        run: python scripts/lead_inflow.py
      - name: WhatsApp ve CRM işlemleri
        continue-on-error: true
        run: python scripts/live_ingest.py
      # Taze veriyle hedef temposu; gerisindekilere Cliq (ilk 14 gün AI'lı
      # mesajlar panelde onay bekler). Hata ingest'i başarısız saymaz.
      - name: Tempo dürtmesi
        continue-on-error: true
        run: python scripts/pace_nudges.py
