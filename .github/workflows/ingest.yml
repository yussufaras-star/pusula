# Günlük ingest — 08:00 Europe/Istanbul = 05:00 UTC (TR UTC+3, DST yok).
# Her kaynak ayrı job: timeout paylaşılmaz. Sıra: calls → leads →
# contacts → bookings → deals. nudges aynı concurrency grubunu bekler.
name: ingest

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: pusula-ops
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
  ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
  ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
  ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
  ZOHO_ACCOUNTS_DOMAIN: ${{ secrets.ZOHO_ACCOUNTS_DOMAIN }}
  ZOHO_API_DOMAIN: ${{ secrets.ZOHO_API_DOMAIN }}

jobs:
  sync-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Sync calls
        run: python scripts/run_ingest.py --source zoho_crm_calls

  sync-leads:
    needs: sync-calls
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Sync leads
        run: python scripts/ingest_leads.py --lookback-days 14

  sync-contacts:
    needs: sync-leads
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Sync contacts
        run: python scripts/ingest_sales_cycle.py --contacts-only --lookback-days 14

  sync-bookings:
    needs: sync-contacts
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Sync bookings
        run: python scripts/run_ingest.py --source zoho_bookings

  sync-deals:
    needs: sync-bookings
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Sync deals
        run: python scripts/ingest_sales_cycle.py --deals-only --lookback-days 14
