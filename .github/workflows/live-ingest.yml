# Canlı ingest — elle. Asıl tetik paneldeki "Verileri güncelle" butonu
# (POST /api/ingest); burası yedek. Otomatik tazelik block-ingest.yml
# (saatlik). İstenirse schedule eklenebilir ("*/5 5-16 * * 1-6") veya
# harici tetikleyici /api/cron/live-ingest'i çağırabilir.
name: live-ingest

on:
  workflow_dispatch:

concurrency:
  group: pusula-live-ingest
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
  ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
  ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
  ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
  ZOHO_ACCOUNTS_DOMAIN: ${{ secrets.ZOHO_ACCOUNTS_DOMAIN }}
  ZOHO_API_DOMAIN: ${{ secrets.ZOHO_API_DOMAIN }}
  # Kapatmak için repo değişkeni PUSULA_WHATSAPP_INGEST=0.
  PUSULA_WHATSAPP_INGEST: ${{ vars.PUSULA_WHATSAPP_INGEST }}

jobs:
  live-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements.txt
      - name: Canlı ingest
        run: python scripts/live_ingest.py
