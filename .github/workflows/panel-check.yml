# API testleri, panel_check ve arayüz derlemesi — kırık sürümü push anında yakala.
name: panel-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Testler
        run: python -m pytest -q eval/test_kpi_standards.py eval/test_panel_auth.py eval/test_panel_hours.py eval/test_vercel_api.py eval/test_live_metrics.py eval/test_live_ingest.py eval/test_compare.py eval/test_occupancy.py eval/test_zoho_meeting.py eval/test_meetings.py eval/test_targets.py eval/test_portfolio.py eval/test_sales_report.py eval/test_cliq.py eval/test_lead_attribution.py eval/test_commission.py eval/test_reco.py eval/test_churn.py eval/test_ciro_trend.py eval/test_source_yield.py eval/test_meeting_nudges.py eval/test_people_leaves.py
      - name: API'yi içe aktar
        run: python -c "import vercel_app"
      - name: panel_check çalıştır
        run: python scripts/panel_check.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
