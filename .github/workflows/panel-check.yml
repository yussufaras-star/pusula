# Panel import ve panel_check — canlı ImportError'u push anında yakala.
name: panel-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}

jobs:
  panel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements.txt
      - name: Paneli içe aktar
        run: python -c "import app.panel"
      - name: panel_check çalıştır
        run: python scripts/panel_check.py
      - name: Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/panel_ui_check.py --shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-shots
          path: /tmp/pusula-panel-shots/*.png
          if-no-files-found: ignore
