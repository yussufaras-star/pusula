# Finans senkronu: ECB kurları + API'li banka hesapları (Mercury, Wise,
# Stripe, Revolut). Günde 2 kez, 08:00 ve 17:00 İstanbul (UTC+3).
# Panelde "Hesapları güncelle" butonu (POST /api/finance/sync) anlık yoldur.
#
# Sağlayıcı anahtarları repo secrets'ta <SAĞLAYICI>_<KEY> adıyla durur
# (ör. MERCURY_TOKEN_LLC) ve aşağıda tek tek verilir. Yeni bir hesap eki
# (ör. WISE_TOKEN_GMBH) eklenince buraya da bir satır eklenmeli; tanımsız
# secret boş gelir ve o hesap "Eksik ortam değişkeni" hatası verir.
name: finance-sync

on:
  schedule:
    - cron: "0 5,14 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Geriye bakış (gün); boşsa son senkrondan"
        required: false

concurrency:
  group: pusula-finance-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}

jobs:
  finance-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements.txt
      - name: Finans senkronu
        env:
          MERCURY_TOKEN_LLC: ${{ secrets.MERCURY_TOKEN_LLC }}
          WISE_TOKEN_LLC: ${{ secrets.WISE_TOKEN_LLC }}
          DAYS: ${{ inputs.days }}
        run: python scripts/finance_sync.py ${DAYS:+--days "$DAYS"}
