# Temsilci tablosu öğle + akşam, prim kartı yalnız akşam (gün sonu) ekip Cliq kanalına.
name: card-snapshots

on:
  schedule:
    # 12:30 ve 18:30 İstanbul (UTC+3), Pzt–Cmt. GitHub zamanlaması gecikebilir.
    - cron: "30 9 * * 1-6"
    - cron: "30 15 * * 1-6"
  workflow_dispatch:

concurrency:
  group: card-snapshots
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
  CLIQ_WEBHOOK_URL: ${{ secrets.CLIQ_WEBHOOK_URL }}
  CLIQ_SHARE_CHANNEL: salessupport

jobs:
  card-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Arayüzü derle
        run: npm --prefix web ci && npm --prefix web run build
      - name: Bağımlılıkları kur
        run: |
          python -m pip install -r requirements.txt uvicorn==0.32.0 playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Kart görsellerini kanala gönder
        # Öğle tetiği yalnız temsilciler; akşam ve elle çalıştırma ikisi birden.
        run: python scripts/card_snapshots.py --cards "${{ github.event.schedule == '30 9 * * 1-6' && 'temsilciler' || 'prim,temsilciler' }}"
