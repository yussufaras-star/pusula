# Gün saati: GitHub'ın zamanlanmış tetikleri saatlerce gecikiyor (Ekim 2026'da
# 18:30 kartı 21:51'de gitti). Elle tetiklenen işler ise saniyeler içinde
# başlıyor. Bu iş sabah bir kez başlar, gün boyu bekler ve card-snapshots'ı
# 12:30, 15:30, 18:30'da (pazar hariç) workflow_dispatch ile tetikler.
# Saatlik block-ingest'i harici bir tetikleyici her saat :07'de dispatch
# ediyor (13 Ekim'den beri); burada tekrarlanmaz.
#
# Tetikler: Zoho Cliq günlük zamanlayıcısı (08:55 olmalı; Ekim 2026'da 20:55'te
# geliyordu), aşağıdaki yedek cron ve block-ingest'in saatlik güvencesi (o gün
# hiç başlamadıysa başlatır). Birden çok başlarsa sonrakiler sırada bekler,
# sıra geldiğinde saati geçmiş adımları atlar.
# Bir iş 6 saati aşamaz; her kart kendi ardışık işinde beklenir.
name: gun-saati

on:
  schedule:
    - cron: "50 5 * * *"
  workflow_dispatch:

concurrency:
  group: pusula-gun-saati
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  # CEO özeti: sabah iş başlar başlamaz (günde bir kez; tekrar tetiklenirse atlar).
  # Alıcı depo değişkeni CEO_OZET_ALICI; boşsa gönderilmez.
  ceo-ozeti:
    if: ${{ vars.CEO_OZET_ALICI != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
      CLIQ_WEBHOOK_URL: ${{ secrets.CLIQ_WEBHOOK_URL }}
      PUSULA_SHADOW_EMAIL: ${{ secrets.PUSULA_SHADOW_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/ceo_summary.py --send --to "${{ vars.CEO_OZET_ALICI }}"

  kart-1230:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: . scripts/gun_saati.sh && kart "12:30"

  kart-1530:
    needs: kart-1230
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: . scripts/gun_saati.sh && kart "15:30"

  kart-1830:
    needs: kart-1530
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: . scripts/gun_saati.sh && kart "18:30"
