name: hourly-kpi-nudges

on:
  schedule:
    - cron: "20 7-15 * * 1-5"
    - cron: "20 7-11 * * 6"
  workflow_dispatch:

concurrency:
  group: pusula-block
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
  CLIQ_WEBHOOK_URL: ${{ secrets.CLIQ_WEBHOOK_URL }}
  PUSULA_SHADOW_EMAIL: ${{ secrets.PUSULA_SHADOW_EMAIL }}

jobs:
  hourly-kpi-nudges:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Evaluate hourly KPI nudges
        run: python -c "from pusula.hourly_nudges import run_hourly_nudges; print(run_hourly_nudges())"
