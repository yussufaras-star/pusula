# Panel yayını. Uygulama adı Fly'da tekildir.
# Bölge Frankfurt: Türkiye'ye yakın, Supabase AB ile aynı tarafta.

app = "rexven-pusula"
primary_region = "fra"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/_stcore/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
